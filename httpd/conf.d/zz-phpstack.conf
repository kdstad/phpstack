ProxyTimeout 600

RemoteIPHeader CF-Connecting-IP

# REMOTE_ADDR is rewritten to the real client IP above, so PrestaShop's proxy-IP-based
# trusted-proxy check never matches; set HTTPS directly instead so it's trusted unconditionally.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

ServerName default-server.docker.internal

ServerSignature Off
ServerTokens Prod

<FilesMatch ".+\.ph(ar|p|tml)$">
    SetHandler "proxy:fcgi://${PHP_FPM_HOST}:${PHP_FPM_PORT}"
</FilesMatch>

<FilesMatch ".+\.phps$">
	Require all denied
</FilesMatch>

<FilesMatch "^\.ph(ar|p|ps|tml)$">
	Require all denied
</FilesMatch>
